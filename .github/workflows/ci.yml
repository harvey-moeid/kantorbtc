name: Kantor CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare deployment target (main only)
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: kantor-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.environment || 'staging' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"

jobs:
  validate:
    name: Format, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Check Worker packaging without deployment
        env:
          DEPLOY_ENVIRONMENT: staging
          CLOUDFLARE_D1_DATABASE_ID: 11111111-2222-4333-8444-555555555555
        run: |
          node scripts/configure-deploy.mts --dry-run
          pnpm exec wrangler deploy --dry-run --config .wrangler/ci-deploy/wrangler.json --outdir .wrangler/ci-deploy/bundle
      - name: Save validated frontend
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Desktop and mobile smoke tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Select installed Chromium
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(f"CHROMIUM_PATH={p.chromium.executable_path}")
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-${{ github.sha }}
          path: dist/
      - run: bash scripts/ci-browser.sh
      - name: Save screenshots and server logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-results-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy Cloudflare
    needs: [validate, browser]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'staging' }}
    concurrency:
      group: cloudflare-${{ inputs.environment || 'staging' }}
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_HEALTH_URL: ${{ vars.CLOUDFLARE_HEALTH_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-${{ github.sha }}
          path: dist/
      - name: Validate settings and generate deployment config
        run: node scripts/configure-deploy.mts
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote --config .wrangler/ci-deploy/wrangler.json
      - name: Deploy the validated build
        run: pnpm exec wrangler deploy --config .wrangler/ci-deploy/wrangler.json
      - name: Check deployed application
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 --max-time 15 "$CLOUDFLARE_HEALTH_URL" --output /tmp/kantor-health.json
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const health = JSON.parse(readFileSync('/tmp/kantor-health.json', 'utf8'));
          if (health.status !== 'ok' || health.app !== 'kantor' || health.mode !== 'demo') {
            throw new Error('Unexpected deployment health response');
          }
          console.log('Deployed application is healthy in demo mode.');
          JS
